# Render Blueprint for SaveIQ production (saveiq-production).
# Apply in the SaveIQ workspace as a separate Blueprint from staging.
#
# Required setup:
# - Billing enabled (paid Postgres / Key Value / web plans)
# - Registry credential named ghcr-saveiq
# - Distinct secrets from staging (ADMIN_API_TOKEN, provider keys)
#
# Gate 10A/10C: all AI / bandit / personalization flags remain OFF by default.
# Digests pinned to Gate 10D significance fix (sha-5d9d564); FEATURE_ABTEST_ENABLED stays false until intentional start.

previews:
  generation: off

services:
  - type: web
    name: dealhunter-production-api
    runtime: image
    plan: starter
    region: oregon
    numInstances: 1
    autoDeployTrigger: "off"
    image:
      url: "ghcr.io/leoly5945-hash/saveiq-engine@sha256:aa0d1c1e9b84d5b2062deae9e402d40bd16f8b834a7b921a033c5e9a4c6adf72"
      creds:
        fromRegistryCreds:
          name: ghcr-saveiq
    dockerCommand: python -m app.server
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_NAME
        value: SaveIQ API
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: API_CORS_ORIGINS
        value: "https://dealhunter-production-web.onrender.com,https://saveiq.ca,https://www.saveiq.ca"
      - key: ADMIN_API_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: dealhunter-production-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dealhunter-production-redis
          property: connectionString
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_PUBLIC_PER_MINUTE
        value: "100"
      - key: RATE_LIMIT_AUTH_PER_MINUTE
        value: "1000"
      - key: RATE_LIMIT_ADMIN_PER_MINUTE
        value: "50"
      - key: STRUCTURED_LOGGING
        value: "true"
      - key: METRICS_ENABLED
        value: "true"
      - key: METRICS_TOKEN
        sync: false
      - key: FEATURE_LLM_INTENT_PARSER
        value: "false"
      - key: LLM_INTENT_PARSER_MODE
        value: disabled
      - key: OPENAI_API_KEY
        sync: false
      - key: FEATURE_AI_ROUTER
        value: "true"
      - key: AI_ROUTER_MODE
        value: live
      - key: AI_ROUTER_DEFAULT_MODEL
        value: intent-parser-v0
      - key: AI_ROUTER_STRATEGY
        value: cost_optimized
      - key: AI_ROUTER_FALLBACK_PROVIDER
        value: openai
      - key: AI_ROUTER_CACHE_ENABLED
        value: "true"
      - key: AI_ROUTER_CACHE_TTL_SECONDS
        value: "300"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FEATURE_BANDIT_ROUTER
        value: "false"
      - key: BANDIT_ROUTER_MODE
        value: disabled
      - key: BANDIT_EPSILON
        value: "0.1"
      - key: BANDIT_ALPHA
        value: "0.5"
      - key: BANDIT_MIN_SAMPLES_READY
        value: "10"
      - key: BANDIT_REWARD_ALPHA
        value: "0.5"
      - key: BANDIT_REWARD_BETA
        value: "0.3"
      - key: BANDIT_REWARD_GAMMA
        value: "0.2"
      - key: BANDIT_REWARD_DELTA
        value: "0.0"
      - key: FEATURE_PERSONALIZATION
        value: "false"
      - key: PERSONALIZATION_CACHE_ENABLED
        value: "true"
      - key: PERSONALIZATION_CACHE_TTL_SECONDS
        value: "300"
      - key: FEATURE_CHINESE_LLM_PROVIDERS
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: BAIDU_API_KEY
        sync: false
      - key: BAIDU_SECRET_KEY
        sync: false
      - key: BANDIT_POLICY
        value: linucb
      - key: FEATURE_NEURAL_BANDIT
        value: "true"
      - key: FEATURE_RLHF_ROUTER
        value: "true"
      - key: FEATURE_LLM_USER_EMBEDDING
        value: "false"
      - key: FEATURE_BAYESIAN_TUNING
        value: "false"
      - key: FEATURE_AUTO_TUNING
        value: "true"
      - key: FEATURE_KILL_SWITCH
        value: "true"
      - key: AUTO_TUNE_DRY_RUN
        value: "true"
      - key: AUTO_TUNE_CANARY_ENABLED
        value: "false"
      - key: CANARY_ENABLED
        value: "false"
      - key: CANARY_PERCENTAGE
        value: "0"
      - key: CANARY_FEATURES
        value: router,bandit,personalization,llm_cn
      - key: CANARY_STICKY_SESSION
        value: "true"
      - key: FEATURE_ABTEST_ENABLED
        value: "false"
      - key: ABTEST_CONFIG_PATH
        value: config/abtest.yaml
      - key: ABTEST_REDIS_TTL
        value: "2592000"

  - type: web
    name: dealhunter-production-web
    runtime: image
    plan: starter
    region: oregon
    numInstances: 1
    autoDeployTrigger: "off"
    image:
      url: "ghcr.io/leoly5945-hash/saveiq-web@sha256:2fdd6a70412f2daacfb1925d54f73ab5478a215bf286201969d78f4f813e2a6d"
      creds:
        fromRegistryCreds:
          name: ghcr-saveiq
    dockerCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: "https://dealhunter-production-api.onrender.com"
      - key: NEXT_PUBLIC_BRAND_NAME
        value: SaveIQ
      # Public launch (2026-08-29): the site is now indexable. Flipping this
      # back to "true" also requires reverting the guardrails in
      # scripts/validate_render_blueprint.py and scripts/production_smoke.py.
      # Both keys must be pinned to "false": proxy.ts emits noindex if EITHER
      # is "true", and Render does not delete an env var when it is removed
      # from the blueprint (a leftover STAGING_NOINDEX=true kept the site
      # noindex after the first launch sync).
      - key: PRODUCTION_NOINDEX
        value: "false"
      - key: STAGING_NOINDEX
        value: "false"
      - key: INTERNAL_TOOLS_USER
        sync: false
      - key: INTERNAL_TOOLS_PASSWORD
        sync: false

  - type: keyvalue
    name: dealhunter-production-redis
    plan: starter
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: dealhunter-production-postgres
    databaseName: dealhunter
    user: dealhunter
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: 16
    ipAllowList: []
