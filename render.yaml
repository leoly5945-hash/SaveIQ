# Render Blueprint for DealHunter staging.
# Replace all placeholder values before applying this Blueprint.
#
# Required Render workspace setup:
# - Workspace: SaveIQ
# - Billing enabled
# - Registry credential named ghcr-saveiq with access to the GHCR images

previews:
  generation: off

services:
  - type: web
    name: dealhunter-staging-api
    runtime: image
    plan: free
    region: oregon
    image:
      url: "ghcr.io/leoly5945-hash/saveiq-engine@sha256:5ba5bebe0f41cc71684b27fcccec136a846f4f7f3ed5b59edead4b63f77345de"
      creds:
        fromRegistryCreds:
          name: ghcr-saveiq
    dockerCommand: python -m app.server
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_NAME
        value: DealHunter API
      - key: ENVIRONMENT
        value: staging
      - key: LOG_LEVEL
        value: info
      - key: API_CORS_ORIGINS
        value: "https://dealhunter-staging-web.onrender.com"
      - key: ADMIN_API_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: dealhunter-staging-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dealhunter-staging-redis
          property: connectionString
      - key: FEATURE_LLM_INTENT_PARSER
        value: "false"
      - key: LLM_INTENT_PARSER_MODE
        value: disabled
      - key: FEATURE_AI_ROUTER
        value: "false"
      - key: AI_ROUTER_MODE
        value: disabled
      - key: AI_ROUTER_DEFAULT_MODEL
        value: intent-parser-v0
      - key: AI_ROUTER_STRATEGY
        value: cost_optimized
      - key: AI_ROUTER_FALLBACK_PROVIDER
        value: openai
      - key: AI_ROUTER_CACHE_ENABLED
        value: "true"
      - key: AI_ROUTER_CACHE_TTL_SECONDS
        value: "300"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FEATURE_BANDIT_ROUTER
        value: "false"
      - key: BANDIT_ROUTER_MODE
        value: disabled
      - key: BANDIT_EPSILON
        value: "0.1"
      - key: BANDIT_ALPHA
        value: "0.5"
      - key: BANDIT_MIN_SAMPLES_READY
        value: "10"
      - key: BANDIT_REWARD_ALPHA
        value: "0.5"
      - key: BANDIT_REWARD_BETA
        value: "0.3"
      - key: BANDIT_REWARD_GAMMA
        value: "0.2"
      - key: BANDIT_REWARD_DELTA
        value: "0.0"
      - key: FEATURE_PERSONALIZATION
        value: "false"
      - key: PERSONALIZATION_CACHE_ENABLED
        value: "true"
      - key: PERSONALIZATION_CACHE_TTL_SECONDS
        value: "300"
      - key: FEATURE_CHINESE_LLM_PROVIDERS
        value: "false"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: BAIDU_API_KEY
        sync: false
      - key: BAIDU_SECRET_KEY
        sync: false
      - key: BANDIT_POLICY
        value: linucb
      - key: FEATURE_NEURAL_BANDIT
        value: "false"
      - key: FEATURE_RLHF_ROUTER
        value: "true"
      - key: FEATURE_LLM_USER_EMBEDDING
        value: "false"
      - key: FEATURE_BAYESIAN_TUNING
        value: "false"
      - key: FEATURE_AUTO_TUNING
        value: "false"
      - key: FEATURE_KILL_SWITCH
        value: "false"
      - key: AUTO_TUNE_DRY_RUN
        value: "true"
      - key: FEATURE_ABTEST_ENABLED
        value: "false"
      - key: CANARY_ENABLED
        value: "false"
      - key: CANARY_PERCENTAGE
        value: "0"
      - key: CANARY_FEATURES
        value: router,bandit,personalization,llm_cn
      - key: CANARY_STICKY_SESSION
        value: "true"

  - type: web
    name: dealhunter-staging-web
    runtime: image
    plan: free
    region: oregon
    image:
      url: "ghcr.io/leoly5945-hash/saveiq-web@sha256:363f14422b21f388ec164e31951242d60457f6387eed5548998431d809751abd"
      creds:
        fromRegistryCreds:
          name: ghcr-saveiq
    dockerCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: "https://dealhunter-staging-api.onrender.com"
      - key: NEXT_PUBLIC_BRAND_NAME
        value: DealHunter
      - key: STAGING_NOINDEX
        value: "true"

  - type: keyvalue
    name: dealhunter-staging-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: dealhunter-staging-postgres
    databaseName: dealhunter
    user: dealhunter
    plan: free
    region: oregon
    postgresMajorVersion: 16
    ipAllowList: []
