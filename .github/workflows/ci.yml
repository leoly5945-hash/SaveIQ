name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dealhunter_test
          POSTGRES_USER: dealhunter
          POSTGRES_PASSWORD: dealhunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealhunter -d dealhunter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://dealhunter:dealhunter@localhost:5432/dealhunter_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      # Repo-root src/ is shipped in the API image (COPY src ./src) but lives
      # outside apps/api, so lint/type-check it explicitly here.
      - run: ruff check ../../src
      - run: ruff format --check ../../src
      - run: mypy ../../src
      - run: alembic upgrade head
      - run: pytest
      - run: python ../../scripts/evaluate_recommendations.py
      - name: Validate Render blueprints
        run: |
          python ../../scripts/validate_render_blueprint.py ../../render.yaml
          python ../../scripts/validate_render_blueprint.py ../../render-production.yaml --profile production --allow-neural-bandit --allow-rlhf-router --allow-rlhf-after-neural --allow-kill-switch --allow-auto-tuning

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Export API runtime requirements
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("apps/api/pyproject.toml").read_text(encoding="utf-8"))
          Path("apps/api/requirements-audit.txt").write_text(
              "\n".join(data["project"]["dependencies"]) + "\n",
              encoding="utf-8",
          )
          PY
      - name: pip-audit runtime dependencies
        run: python -m pip_audit -r apps/api/requirements-audit.txt --progress-spinner=off
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
